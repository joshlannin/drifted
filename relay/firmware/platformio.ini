; Drifted relay firmware for the M5Stack NanoC6 (ESP32-C6, 4 MB flash).
; Build:  pio run            Flash over USB:  pio run -t upload       Serial monitor:  pio device monitor
; It is also a plain ESP-IDF project (idf.py build) because the sources live in main/.

[platformio]
src_dir = main

[env:nanoc6]
; espressif32 8.0.0 = ESP-IDF 6.1.0 (dependencies.lock pins the mdns and led_strip components)
platform = espressif32 @ 8.0.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = direct
