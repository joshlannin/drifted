openapi: 3.1.0
info:
  title: drifted-host
  version: 0.1.0
  description: |
    Local HTTP API of the Drifted host (Drifted.app or drifted-host). One process holds the table's Bluetooth
    connection; clients use this API. Auth: `Authorization: Bearer <token>`, token in
    `~/Library/Application Support/Drifted/token`. Drawings: `xy` [[x, y]…] in table radii (unit disc,
    +x right, +y up), or `points` [[theta, rho]…], or `thr` text.
servers: [{ url: "http://localhost:8765" }]
security: [{ bearer: [] }]
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    Drawing:
      type: object
      properties:
        name: { type: string }
        xy: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        points: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        thr: { type: string }
        clear: { type: string, enum: [none, area, full], description: "show/validate/preview: sweep the sand first" }
    Switch:
      type: object
      properties: { on: { type: boolean } }
      required: [on]
    Job:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        state: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number }
        error: { type: string }
        result: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      properties: { error: { type: string } }
    Schedule:
      type: object
      properties:
        enabled: { type: boolean }
        weatherAt: { type: [string, "null"], description: "Local HH:mm: fetch today's forecast and draw the weather picture (turns the table on; holds the playlist). null skips it" }
        playlistAt: { type: [string, "null"], description: "Local HH:mm: the playlist carries on. null skips it" }
        location: { type: object, properties: { latitude: { type: number }, longitude: { type: number } }, description: "Fixed coordinates for the forecast" }
        units: { type: string, enum: [fahrenheit, celsius] }
        seasons:
          type: array
          items:
            type: object
            required: [name, start, end]
            properties:
              name: { type: string }
              start: { type: string, description: "MM-DD (every year) or YYYY-MM-DD; inclusive" }
              end: { type: string, description: "Same form as start; inclusive. MM-DD may wrap the new year" }
              ids: { type: array, items: { type: integer }, description: "Stored pattern ids to mix into the playlist. With the playlist's ids empty, they play only in season" }
              weight: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "Share of playlist picks from ids: 0.5 every other pattern, 1 only these" }
              colors: { type: array, items: { type: string }, description: "#rrggbb for the lamp; with several, the next with each pattern. The first listed season with colours wins" }
              playlistAt: { type: string, description: "HH:mm (24-hour, local): on the season's days the playlist step runs at this time instead of playlistAt (the earliest, if several seasons have one)" }
              weather: { type: boolean, default: true, description: "false skips the weather step on the season's days" }
paths:
  /status:
    get:
      summary: "Connection, current drawing and progress, settings, latched alarms, and link: {via: bluetooth} or {via: relay, relay, relayConnected, tableLink, rssi, wifiRssi, firmware} (rssi is then the relay's signal to the table)"
      responses: { "200": { description: Status } }
  /log:
    get:
      summary: Recent host log lines (also written to ~/Library/Logs/Drifted/drifted-host.log)
      parameters: [{ name: lines, in: query, schema: { type: integer, default: 200 } }]
      responses: { "200": { description: "{ file, lines }" } }
  /events:
    get:
      summary: Server-Sent Events (status, connection, state, job, alarm, live)
      responses: { "200": { description: "text/event-stream" } }
  /connect:
    post: { summary: Reconnect to the table, responses: { "200": { description: OK } } }
  /disconnect:
    post: { summary: Release the table (e.g. so the HoMedics app can connect), responses: { "200": { description: OK } } }
  /relay:
    get:
      summary: "Drifted relay (relay/README.md): a Wi-Fi board next to the table that holds its Bluetooth link. {enabled, host, port, name, tokenSet, active, connected, relay, status}; status is the relay's own report (link, table, rssi to the table, wifiRssi, firmware, gate, stats)"
      responses: { "200": { description: Relay setting and status } }
    put:
      summary: "Reach the table through a relay (enabled=true) or this Mac's Bluetooth (false). Fields left out stay; host null finds the relay by Bonjour (name, or the first found). Saved as relay.json (0600) in the state dir; the link restarts"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                host: { type: [string, "null"], description: "IP address or host name" }
                port: { type: [integer, "null"], default: 8766 }
                name: { type: [string, "null"], description: "Bonjour name, e.g. drifted-relay-1a2b3c" }
                token: { type: string, minLength: 16, description: "The relay's token (relay/setup.py prints it)" }
      responses: { "200": { description: Relay setting and status }, "400": { description: Invalid field } }
  /relay/discover:
    get: { summary: "Relays advertising _drifted-relay._tcp on the local network (3 s Bonjour browse): {relays: [{name, firmware, proto}]}", responses: { "200": { description: Relays } } }
  /relay/command:
    post:
      summary: "Send the relay a command: scan (answer includes tables), select ADDRESS|NAME (the table it uses; remembered), forget, hold on|off (keep the table linked with no host), status, reboot, ota URL. Use /disconnect and /connect to release or retake the table"
      requestBody: { content: { application/json: { schema: { type: object, properties: { command: { type: string } }, required: [command] } } } }
      responses: { "200": { description: "{command, ok, message, tables?}" }, "409": { description: Not connected to a relay } }
  /show:
    post:
      summary: Draw now, via managed slots (validated; reuses a slot that already holds the drawing)
      parameters: [{ name: wait, in: query, schema: { type: boolean }, description: "wait for the upload to finish" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Drawing" } } } }
      responses:
        "200": { description: Finished job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "202": { description: Queued job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { description: Invalid drawing, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: A live session is running }
  /patterns:
    get: { summary: Stored pattern ids (names for drifted-host-managed ones), responses: { "200": { description: List } } }
    post:
      summary: Save a drawing permanently under a name
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Drawing" } } } }
      responses: { "202": { description: Queued job } }
  /patterns/{id}:
    delete:
      summary: Delete a saved pattern (force=true for others)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: force, in: query, schema: { type: boolean } }
      responses: { "202": { description: Queued job }, "404": { description: Not on the table }, "409": { description: Not saved, or drawing } }
  /patterns/validate:
    post:
      summary: Check a drawing; returns issues (error/fixed/warning) and stats (points, length, estimatedSeconds)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Drawing" } } } }
      responses: { "200": { description: Report } }
  /patterns/preview:
    post:
      summary: Digital-twin preview of a drawing, before anything moves
      description: >
        Simulates the table: the moves between points, drawing speed and a groove as wide as the ball
        (docs/digital-twin.md). style=sand shows how the sand should look afterwards (close lines merge, as on the
        table); style=path is a thin route diagram (green start, red end). format=gif returns an animation of the
        ball drawing it. Use POST /patterns/validate for timing and issues.
      parameters:
        - { name: size, in: query, schema: { type: integer, default: 512 }, description: "pixels (GIF max 768)" }
        - { name: style, in: query, schema: { type: string, enum: [path, sand], default: path } }
        - { name: format, in: query, schema: { type: string, enum: [png, gif], default: png } }
        - { name: frames, in: query, schema: { type: integer, default: 60, maximum: 300 }, description: "gif only" }
        - { name: seconds, in: query, schema: { type: number, default: 6 }, description: "gif only: playback length before a 2 s hold" }
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Drawing" } } } }
      responses: { "200": { description: PNG or GIF, content: { image/png: {}, image/gif: {} } } }
  /play:
    post:
      summary: Play a stored pattern
      requestBody: { content: { application/json: { schema: { type: object, properties: { id: { type: integer } }, required: [id] } } } }
      responses: { "200": { description: Job } }
  /pause: { post: { summary: Toggle play/pause, responses: { "200": { description: Job } } } }
  /next: { post: { summary: "Next pattern. With the playlist on, the playlist's next (ends a hold); otherwise the table's own next", responses: { "200": { description: Job } } } }
  /playlist:
    get: { summary: "Drifted's playlist: {active, shuffle, ids, patterns, current, holding?, leftThisRound?, onTable, table: {name, ids, written?, current (the table's current playlist), stored: [{name, count}]}}", responses: { "200": { description: Playlist } } }
    put:
      summary: "Turn the playlist on or off, or set its ids and order. While on, drifted-host starts the next pattern whenever the table finishes one. /show and live sessions put it on hold (holding) so the drawing stays; /next or active=true carries on. Saved across restarts."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                shuffle: { type: boolean, description: "Shuffle without repeats until every pattern has played (default true); false plays in id order" }
                ids: { type: array, items: { type: integer }, description: "Pattern ids to play; [] means every stored pattern except the show slots" }
                onTable: { type: boolean, description: "Keep the shuffle on the table: each advance writes the next picks (at most 20) as the table's own playlist (drifted_mix) and starts it with loop on, so the table carries on with no host. Turning it on writes the list without starting it; holds turn the table's loop off" }
      responses: { "200": { description: Playlist } }
  /schedule:
    get: { summary: "The daily routine (docs/schedule.md) and today's status: {enabled, weatherAt, playlistAt, location, units, seasons, status}; status.weatherAtToday and status.playlistAtToday are when the steps run today (null: off)", responses: { "200": { description: Schedule } } }
    put:
      summary: "Change the daily routine; fields left out stay as they are. Saved in the state dir (schedule.json). Turning it on, or moving a time, mid-day doesn't run steps whose time has passed"
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
      responses: { "200": { description: Schedule }, "400": { description: Invalid field } }
  /schedule/run:
    post:
      summary: "Run a step now (for testing; the day's scheduled steps still run). weather fetches today's forecast and draws the picture, holding the playlist; dryRun fetches and builds without drawing. playlist ends the hold and starts the next pattern"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                step: { type: string, enum: [weather, playlist] }
                dryRun: { type: boolean, description: "weather only" }
              required: [step]
      responses:
        "200": { description: "weather dryRun: {forecast, drawing}; playlist: {result}" }
        "202": { description: "weather: {forecast: {source, raw, condition, high}, drawing: {name, points, estimatedSeconds}, job}" }
        "409": { description: No location set, or the scheduled weather is running }
  /previous: { post: { summary: Previous pattern, responses: { "200": { description: Job } } } }
  /settings:
    put:
      summary: Lights and modes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                color: { type: string, description: "#rrggbb, fixed colour" }
                brightness: { type: number, minimum: 0, maximum: 1 }
                speed: { type: number, minimum: 0, maximum: 1 }
                shifting: { type: boolean }
                shiftSeconds: { type: integer }
                breathing: { type: boolean }
                random: { type: boolean }
                loop: { type: boolean }
                power: { type: boolean, description: "Sends 0x14/16. false only pauses; it is not a real power-off (docs/protocol.md)" }
                rotation: { type: number, description: "Degrees counter-clockwise added to every drawing sent to the table (show, save, live), so pictures stand upright for the viewer. Saved by drifted-host, never sent to the table; /status shows it. Previews are not rotated." }
      responses: { "200": { description: Job } }
  /power:
    get: { summary: "Power switch: {on}. Apple Home and the like poll this", responses: { "200": { description: "{ on }" } } }
    post:
      summary: Turn the table on or off. Off stops the ball where it is (0x14/16 false) and keeps it stopped until on or a drawing request
      description: Answers at once. sent=false means the table is reconnecting; an off is re-sent on every reconnect. POST /power/on and /power/off take no body.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Switch" } } } }
      responses: { "200": { description: "{ on, sent }" } }
  /power/on: { post: { summary: 'Same as POST /power {"on":true}', responses: { "200": { description: "{ on, sent }" } } } }
  /power/off: { post: { summary: 'Same as POST /power {"on":false}', responses: { "200": { description: "{ on, sent }" } } } }
  /lamp:
    get: { summary: "Lamp switch: {on}. Separate from power", responses: { "200": { description: "{ on }" } } }
    post:
      summary: Turn the lamp on (at its last brightness) or off (0x14/7). An off is re-sent on every reconnect
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Switch" } } } }
      responses: { "200": { description: "{ on, sent }" } }
  /lamp/on: { post: { summary: 'Same as POST /lamp {"on":true}', responses: { "200": { description: "{ on, sent }" } } } }
  /lamp/off: { post: { summary: 'Same as POST /lamp {"on":false}', responses: { "200": { description: "{ on, sent }" } } } }
  /jobs/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Job } }
  /live/start:
    post: { summary: Start a live session (exclusive; random and loop turned off), responses: { "200": { description: OK } } }
  /live/segments:
    post:
      summary: Queue a segment (10–30 s of drawing); interrupt=true cuts in at once
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/Drawing" }
                - { type: object, properties: { interrupt: { type: boolean } } }
      responses: { "202": { description: "{segment, depth}" } }
  /live/stop:
    post: { summary: End the live session and restore settings, responses: { "200": { description: OK } } }
